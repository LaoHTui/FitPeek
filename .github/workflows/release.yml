name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable package
        shell: pwsh
        run: .\build.ps1 -PythonPath python

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash FitPeek_Portable.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  FitPeek_Portable.zip" | Set-Content FitPeek_Portable.zip.sha256 -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $notesFile = "RELEASE_NOTES_$releaseVersion.md"
          $releaseArgs = @(
            "release", "create", $env:GITHUB_REF_NAME,
            "FitPeek_Portable.zip", "FitPeek_Portable.zip.sha256",
            "--title", "FitPeek $env:GITHUB_REF_NAME"
          )
          if (Test-Path -LiteralPath $notesFile) {
            $releaseArgs += @("--notes-file", $notesFile)
          } else {
            $releaseArgs += "--generate-notes"
          }
          gh @releaseArgs
